ShortDescription: Desktop command center for ZMail, ZeroThink, OpenZero, CallChat, and local ZSEC Shield preview.
Description: |-
  ZERO ONE is a desktop command center for the TalkToAI ecosystem.
  It brings ZMail, ZeroThink, OpenZero, and CallChat into one app with isolated persistent sessions,
  user-configured endpoints, and an optional local ZSEC Shield on-demand folder scan preview on Windows x64.

  The bundled ZSEC Shield preview is not real-time antivirus protection.
  Remote workspaces require internet access and may need separate service accounts.
