name: desktop-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  package-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Verify immutable ZSEC release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release verify v0.1.2 --repo ResearchForumOnline/ZSEC-Shield
      - name: Stage pinned ZSEC vendor payload
        shell: pwsh
        run: ./scripts/stage-zsec-vendor.ps1
      - run: npm run pack:win
      - name: Verify packaged ZSEC payload
        run: node build/zsec-vendor-verifier.cjs "release/win-unpacked/resources/zsec-shield" vendor/zsec-shield.lock.json
      - name: Smoke packaged Windows app and ZSEC bridge
        shell: pwsh
        run: ./scripts/smoke-packaged-windows.ps1 -AppPath "release/win-unpacked/ZERO ONE.exe"